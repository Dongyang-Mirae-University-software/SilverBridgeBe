services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmusso-dev-sso-api
    image: dmusso-sso-api:dev
    restart: unless-stopped
    env_file:
      - .env.dev.sso
    ports:
      - "6501:6501"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: mariadb:11.8
    container_name: dmusso-dev-sso-db
    restart: unless-stopped
    env_file:
      - .env.dev.sso
    ports:
      - "6503:3306"
    volumes:
      - dmusso-dev-sso-db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: dmusso-dev-sso-redis
    restart: unless-stopped
    ports:
      - "6504:6379"
    volumes:
      - dmusso-dev-sso-redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-net:
    name: dmusso-dev-sso-net

volumes:
  dmusso-dev-sso-db-data:
    name: dmusso-dev-sso-db-data
  dmusso-dev-sso-redis-data:
    name: dmusso-dev-sso-redis-data

name: CD

on:
  push:
    branches: [ dev ]
    # 배포 산출물(jar)에 영향 없는 문서·산출물 변경은 배포 스킵.
    # push에 포함된 변경이 전부 아래 패턴에 해당할 때만 워크플로우 미실행.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '프로젝트_설명.txt'
      - '.claude/**'
      - '.gitignore'
      - '.gitattributes'
      - 'tools/**'
      - '.hypothesis/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    steps:
      - name: 배포
        run: |
          set -e
          cd ~/SilverBridgeBe
          # 배포 서버는 origin/dev의 순수 미러다(진실의 원천 아님).
          # git pull(merge)은 dev가 rewrite/force-push되면 로컬과 divergent가 되어 실패하므로
          # (2026-07-02 실제 발생: 로컬 578 vs 원격 588 커밋 분기 → 배포 중단),
          # fetch 후 origin/dev로 강제 정렬해 항상 원격과 정확히 일치시킨다.
          git fetch origin dev
          git reset --hard origin/dev

          if [ ! -f .env.dev ]; then
            echo "::error::.env.dev 파일이 호스트에 없습니다 (~/SilverBridgeBe/.env.dev). 배포 중단."
            exit 1
          fi

          # 배포 전 통합 테스트(실제 PostgreSQL - Testcontainers). 실패하면 set -e로 여기서 배포가 멈춘다.
          # 마이그레이션·JPQL·DB 제약을 배포 "전에" 확인한다 - 예전에는 기동 로그로만 알 수 있었다(2026-09-21).
          # 스크립트는 현재 커밋을 임시 폴더에 풀어 JDK 21 gradle 컨테이너에서 돌리므로 이 폴더는 건드리지 않는다.
          bash tools/integration-test.sh HEAD

          docker compose -f docker-compose.dev.yml build api

          docker compose -f docker-compose.dev.yml up -d api
          docker image prune -f

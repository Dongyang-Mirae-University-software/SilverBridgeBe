name: CD

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    steps:
      - name: 배포
        run: |
          set -e
          cd ~/SilverBridgeBe
          git pull origin dev

          if [ ! -f .env.dev ]; then
            echo "::error::.env.dev 파일이 호스트에 없습니다 (~/SilverBridgeBe/.env.dev). 배포 중단."
            exit 1
          fi

          docker compose -f docker-compose.dev.yml build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            api

          docker compose -f docker-compose.dev.yml up -d api
          docker image prune -f

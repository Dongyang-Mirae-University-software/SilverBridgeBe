name: CD

on:
  push:
    branches: [ dev ]
    # 배포 산출물(jar)에 영향 없는 문서·산출물 변경은 배포 스킵.
    # push에 포함된 변경이 전부 아래 패턴에 해당할 때만 워크플로우 미실행.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '프로젝트_설명.txt'
      - '.claude/**'
      - '.gitignore'
      - '.gitattributes'
      - 'tools/**'
      - '.hypothesis/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    steps:
      - name: 배포
        run: |
          set -e
          cd ~/SilverBridgeBe
          git pull origin dev

          if [ ! -f .env.dev ]; then
            echo "::error::.env.dev 파일이 호스트에 없습니다 (~/SilverBridgeBe/.env.dev). 배포 중단."
            exit 1
          fi

          docker compose -f docker-compose.dev.yml build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            api

          docker compose -f docker-compose.dev.yml up -d api
          docker image prune -f

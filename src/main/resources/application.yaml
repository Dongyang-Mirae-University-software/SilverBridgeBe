spring:
  application:
    name: dmu-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dev}
    # 자격증명은 약한 기본값(dev) 제거 — 미설정 시 시작 실패(fail-fast). 검증은 RequiredPropertiesValidator. (A-L3)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway가 스키마 관리 — 엔티티와 DB 불일치 시 시작 실패
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway가 스키마의 단일 진실. 빈 DB에 V1부터 순서대로 적용한다.
    # (schema.sql 시딩 제거됨 — baseline 설정 불필요)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 5MB      # 프로필 이미지 업로드 제한 (기본 1MB → 5MB)
      max-request-size: 5MB

  mvc:
    throw-exception-if-no-handler-found: true   # 존재하지 않는 경로 → NoHandlerFoundException 발생 (Swagger UI 정적 리소스는 영향 없음)

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 6511
  # nginx가 HTTPS 종료 후 HTTP로 프록시 → X-Forwarded-Proto 헤더 신뢰
  # Swagger UI 등에서 요청 URL 생성 시 https 스킴 유지 (Mixed-Content 방지)
  forward-headers-strategy: framework

app:
  cors:
    # 쉼표로 구분된 허용 origin 리스트 (env로 override 가능)
    # 개발 서버: https://devdmu.gosky.kr 만, 로컬: localhost 포트들 포함
    allowed-origins: ${APP_CORS_ORIGINS:https://devdmu.gosky.kr,http://localhost:3000,http://localhost:5173,http://localhost:8080}

jwt:
  # 반드시 .env.dev 또는 운영 환경변수로 지정 (256bit 이상 랜덤 값)
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

# 로그인 잠금 정책 (env로 override 가능)
auth:
  login:
    max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}        # 잠금 전 최대 실패 횟수
    lock-ttl-minutes: ${AUTH_LOGIN_LOCK_TTL_MINUTES:30} # 잠금 유지 시간(분)

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET:}   # 빈 기본값 — 존재/강도 검증은 Required/SecurityConfigValidator가 담당
  redirect-uri: ${KAKAO_REDIRECT_URI}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-phone: ${SOLAPI_SENDER_PHONE}


file-server:
  base-url: ${FILE_SERVER_BASE_URL:https://v1api.gosky.kr}

# 이상감지 카메라 — 피보호자 송출 권장 프레임레이트(카메라 등록 응답으로 내려줌).
# 화재/연기는 느리게 변하고 AI 서버가 5프레임마다 추론(STREAM_SAMPLE_EVERY_N_FRAMES=5)하므로
# 5fps면 충분(과한 fps는 대역폭·GPU 낭비). 필요 시 CAMERA_RECOMMENDED_FPS로 조정.
camera:
  recommended-fps: ${CAMERA_RECOMMENDED_FPS:5}

# AI 이상감지 수신 (1단계 — 수신·판정·이력. 보호자 알림 발송은 2단계).
# 백엔드가 AI WS에 클라이언트로 붙어 latest_analysis를 받는다(AI 서버 무변경 — 웹훅 없음).
# 연결 실패·키 미설정은 기동을 막지 않는다(구독만 비활성/재접속).
anomaly:
  enabled: ${ANOMALY_ENABLED:true}
  ws-url: ${AI_WS_URL:wss://testai.gosky.kr/api/v1/ws/live}
  api-key: ${AI_API_KEY:}                                   # .env.dev로만 주입(평문 커밋 금지). 미설정 시 구독 비활성 + WARN
  # 판정 기준: DANGER(기본, AI가 채운 danger 플래그만 신뢰 — 위험 판정 책임 = AI 서버)
  #            CONFIDENCE(폴백, AI danger 정식화 배포 지연으로 이력 0건일 때만 임시 전환)
  # AI 팀 합의(2026-07-14): 라이브 경로에서 confidence >= 0.6이면 danger=true로 채운다 → 배포되면 DANGER 모드가 실동작
  trigger-mode: ${ANOMALY_TRIGGER_MODE:DANGER}
  confidence-threshold: ${ANOMALY_CONFIDENCE_THRESHOLD:0.6} # CONFIDENCE 폴백 임계 + danger 불일치 경고 기준(AI 합의값과 동일하게 유지)
  cooldown-minutes: ${ANOMALY_COOLDOWN_MINUTES:5}           # 같은 (sessionId, detectedType) 이력 최소 간격 — 매 프레임 broadcast 폭주 방지
  notify-cooldown-minutes: ${ANOMALY_NOTIFY_COOLDOWN_MINUTES:5}        # 보호자 알림 재발송 최소 간격
  notify-self-cooldown-minutes: ${ANOMALY_NOTIFY_SELF_COOLDOWN_MINUTES:1} # 피보호자 본인 알림 재발송 최소 간격(대피 재촉 — 더 짧게)

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

# Actuator — 외부 노출은 health/info만 (민감 정보 유출 방지)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 외부에 DB/Redis 세부 상태 노출 방지
      show-details: never
      probes:
        enabled: true

firebase:
  # 서비스 계정 JSON을 base64로 인코딩해 환경변수에 보관.
  # 원본 JSON을 그대로 .env에 넣으면 docker compose env_file 파서가 \n을 실제 newline으로
  # 변환해 깨지는 문제가 있어 base64로 우회한다.
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

# ─── 로깅 ─────────────────────────────────────────────────────────────────
# 평문 패턴에 MDC userId 포함 (ApiLoggingAspect 가 주입). 미인증 요청에는 'anonymous' 표시.
# 구조적 JSON 로깅은 LOGGING_STRUCTURED_FORMAT 환경변수로 토글 (ecs / gelf / logstash 중 하나).
#   - 빈 값(기본): 평문 콘솔 로그
#   - 값 설정    : 해당 포맷의 JSON 로그 (MDC 자동 포함)
# 운영 적용 전에 로그 수집기/파서 호환성 확인 필요.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [trace=%X{traceId:-}] [user=%X{userId:-anonymous}] %logger{36} - %msg%n"
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT:}

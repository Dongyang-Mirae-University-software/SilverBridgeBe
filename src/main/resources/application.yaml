spring:
  application:
    name: dmu-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dev}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway가 스키마 관리 — 엔티티와 DB 불일치 시 시작 실패
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # schema.sql로 초기화된 DB에 flyway_schema_history 없어도 베이스라인 처리
    baseline-version: 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100    # ?size=999999 같은 과도한 요청 방지

  servlet:
    multipart:
      max-file-size: 5MB      # 프로필 이미지 업로드 제한 (기본 1MB → 5MB)
      max-request-size: 5MB

  mvc:
    throw-exception-if-no-handler-found: true   # 존재하지 않는 경로 → NoHandlerFoundException 발생 (Swagger UI 정적 리소스는 영향 없음)

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 6511

jwt:
  secret: ${JWT_SECRET:main-backend-secret-key-must-be-at-least-256bit-long-for-hs256}
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  redirect-uri: ${KAKAO_REDIRECT_URI}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-phone: ${SOLAPI_SENDER_PHONE}


file-server:
  base-url: https://v1api.brtech.gosky.kr

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

ai:
  server:
    api-key: ${AI_SERVER_API_KEY:change-me-in-production}

spring:
  application:
    name: dmu-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dev}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway가 스키마 관리 — 엔티티와 DB 불일치 시 시작 실패
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # schema.sql로 초기화된 DB에 flyway_schema_history 없어도 베이스라인 처리
    baseline-version: 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 5MB      # 프로필 이미지 업로드 제한 (기본 1MB → 5MB)
      max-request-size: 5MB

  mvc:
    throw-exception-if-no-handler-found: true   # 존재하지 않는 경로 → NoHandlerFoundException 발생 (Swagger UI 정적 리소스는 영향 없음)

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 6511
  # nginx가 HTTPS 종료 후 HTTP로 프록시 → X-Forwarded-Proto 헤더 신뢰
  # Swagger UI 등에서 요청 URL 생성 시 https 스킴 유지 (Mixed-Content 방지)
  forward-headers-strategy: framework

app:
  cors:
    # 쉼표로 구분된 허용 origin 리스트 (env로 override 가능)
    # 프로덕션: https://dmu.gosky.kr 만, 개발: localhost 포트들 포함
    allowed-origins: ${APP_CORS_ORIGINS:https://dmu.gosky.kr,http://localhost:3000,http://localhost:5173,http://localhost:8080}

jwt:
  # 반드시 .env.dev 또는 운영 환경변수로 지정 (256bit 이상 랜덤 값)
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  redirect-uri: ${KAKAO_REDIRECT_URI}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-phone: ${SOLAPI_SENDER_PHONE}


file-server:
  base-url: ${FILE_SERVER_BASE_URL:https://v1api.gosky.kr}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

# Actuator — 외부 노출은 health/info만 (민감 정보 유출 방지)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 외부에 DB/Redis 세부 상태 노출 방지
      show-details: never
      probes:
        enabled: true

firebase:
  # 서비스 계정 JSON을 base64로 인코딩해 환경변수에 보관.
  # 원본 JSON을 그대로 .env에 넣으면 docker compose env_file 파서가 \n을 실제 newline으로
  # 변환해 깨지는 문제가 있어 base64로 우회한다.
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

ai:
  server:
    # 반드시 .env.dev 또는 운영 환경변수로 지정 (32자 이상 랜덤 값)
    api-key: ${AI_SERVER_API_KEY}

spring:
  application:
    name: dmu-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dev}
    # 자격증명은 약한 기본값(dev) 제거 — 미설정 시 시작 실패(fail-fast). 검증은 RequiredPropertiesValidator. (A-L3)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway가 스키마 관리 — 엔티티와 DB 불일치 시 시작 실패
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway가 스키마의 단일 진실. 빈 DB에 V1부터 순서대로 적용한다.
    # (schema.sql 시딩 제거됨 — baseline 설정 불필요)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 5MB      # 프로필 이미지 업로드 제한 (기본 1MB → 5MB)
      max-request-size: 5MB

  mvc:
    throw-exception-if-no-handler-found: true   # 존재하지 않는 경로 → NoHandlerFoundException 발생 (Swagger UI 정적 리소스는 영향 없음)

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 6511
  # nginx가 HTTPS 종료 후 HTTP로 프록시 → X-Forwarded-Proto 헤더 신뢰
  # Swagger UI 등에서 요청 URL 생성 시 https 스킴 유지 (Mixed-Content 방지)
  forward-headers-strategy: framework

app:
  cors:
    # 쉼표로 구분된 허용 origin 리스트 (env로 override 가능)
    # 개발 서버: https://devdmu.gosky.kr 만, 로컬: localhost 포트들 포함
    allowed-origins: ${APP_CORS_ORIGINS:https://devdmu.gosky.kr,http://localhost:3000,http://localhost:5173,http://localhost:8080}

jwt:
  # 반드시 .env.dev 또는 운영 환경변수로 지정 (256bit 이상 랜덤 값)
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

# 로그인 잠금 정책 (env로 override 가능)
auth:
  login:
    max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}        # 잠금 전 최대 실패 횟수
    lock-ttl-minutes: ${AUTH_LOGIN_LOCK_TTL_MINUTES:30} # 잠금 유지 시간(분)

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET:}   # 빈 기본값 — 존재/강도 검증은 Required/SecurityConfigValidator가 담당
  redirect-uri: ${KAKAO_REDIRECT_URI}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-phone: ${SOLAPI_SENDER_PHONE}


file-server:
  base-url: ${FILE_SERVER_BASE_URL:https://v1api.gosky.kr}

# 이상감지 카메라 — 피보호자 송출 권장 프레임레이트(카메라 등록 응답으로 내려줌).
# 화재/연기는 느리게 변하고 AI 서버가 5프레임마다 추론(STREAM_SAMPLE_EVERY_N_FRAMES=5)하므로
# 5fps면 충분(과한 fps는 대역폭·GPU 낭비). 필요 시 CAMERA_RECOMMENDED_FPS로 조정.
camera:
  recommended-fps: ${CAMERA_RECOMMENDED_FPS:5}

# AI 이상감지 수신 (1단계 — 수신·판정·이력. 보호자 알림 발송은 2단계).
# 백엔드가 AI WS에 클라이언트로 붙어 latest_analysis를 받는다(AI 서버 무변경 — 웹훅 없음).
# 연결 실패·키 미설정은 기동을 막지 않는다(구독만 비활성/재접속).
# 복약 알림 발송 (2차). 코드 기본값과 서버 값을 같게 유지한다 —
# 서버만 환경변수로 덮어쓰면 로컬만 다르게 동작하는 문제가 생긴다(이상감지 2026-07-28 교훈).
medication:
  reminder:
    enabled: ${MEDICATION_REMINDER_ENABLED:true}          # 킬 스위치. false면 발송만 멈추고 등록·체크·조회는 그대로
    grace-minutes: ${MEDICATION_REMINDER_GRACE_MINUTES:30}        # 복용 시각을 놓쳤을 때 발송 허용 유예
    retry-delay-minutes: ${MEDICATION_REMINDER_RETRY_DELAY_MINUTES:15}      # 체크 없을 때 재알림까지 대기
    retry-deadline-minutes: ${MEDICATION_REMINDER_RETRY_DEADLINE_MINUTES:60} # 이 시간이 지나면 재알림 포기
    # 미복용 시 보호자에게 보내는 요약(3차). 피보호자 알림과 별개로 끌 수 있다.
    missed-alert:
      enabled: ${MEDICATION_MISSED_ALERT_ENABLED:true}                        # 킬 스위치(보호자 요약만 중단)
      # 발송 시각을 직접 지정하지 않은 보호자에게 적용되는 기본값(KST).
      # 보호자별 시각은 guardian_medication_setting.missed_alert_time에 저장된다(2026-08-27).
      # 이 시각까지 복용 시각이 지난 약만 집계한다 - 아직 먹을 때가 아닌 약은 미복용으로 세지 않는다.
      alert-time: ${MEDICATION_MISSED_ALERT_TIME:21:00}
      deadline-minutes: ${MEDICATION_MISSED_ALERT_DEADLINE_MINUTES:120}       # 이 시간이 지나면 그날 발송 포기

anomaly:
  enabled: ${ANOMALY_ENABLED:true}
  ws-url: ${AI_WS_URL:wss://testai.gosky.kr/api/v1/ws/live}
  api-key: ${AI_API_KEY:}                                   # .env.dev로만 주입(평문 커밋 금지). 미설정 시 구독 비활성 + WARN
  # 판정 기준: DANGER(기본, AI가 채운 danger 플래그만 신뢰 — 위험 판정 책임 = AI 서버)
  #            CONFIDENCE(폴백, AI danger 정식화 배포 지연으로 이력 0건일 때만 임시 전환)
  # AI 팀 합의(2026-07-14): 라이브 경로에서 confidence >= 0.6이면 danger=true로 채운다 → 배포되면 DANGER 모드가 실동작
  trigger-mode: ${ANOMALY_TRIGGER_MODE:DANGER}
  confidence-threshold: ${ANOMALY_CONFIDENCE_THRESHOLD:0.6} # CONFIDENCE 폴백 임계 + danger 불일치 경고 기준(AI 합의값과 동일하게 유지)
  # 빈도 정책(2026-07-28): 이력은 촘촘히(1분) 남겨 화재 지속 구간의 타임라인을 확보하되,
  # 사람에게 가는 알림은 그보다 성기게 — 보호자 5분(알림톡·SMS 건수·카카오 신고 리스크),
  # 본인 3분(현장 당사자라 보호자보다 짧게, 다만 오탐 시 화면 소음을 감안해 1분에서 완화).
  cooldown-minutes: ${ANOMALY_COOLDOWN_MINUTES:1}           # 같은 (sessionId, detectedType) 이력 최소 간격 — 매 프레임 broadcast 폭주 방지
  notify-cooldown-minutes: ${ANOMALY_NOTIFY_COOLDOWN_MINUTES:5}        # 보호자 알림 재발송 최소 간격
  notify-self-cooldown-minutes: ${ANOMALY_NOTIFY_SELF_COOLDOWN_MINUTES:3} # 피보호자 본인 알림 재발송 최소 간격(대피 재촉 — 보호자보다 짧게)
  # 연속 감지를 하나의 "상황"으로 묶는 최대 간격(분). 판정·통계의 단위가 이 상황이다 —
  # 이력 쿨다운(1분) 기준 최대 10건이 한 상황에 묶인다. 상황은 KST 자정을 넘기지 않는다(일자별 통계 기준).
  incident-merge-minutes: ${ANOMALY_INCIDENT_MERGE_MINUTES:10}
  # 판정 미응답 재촉. 답할 때까지 계속 보내면 보호자가 앱 알림을 통째로 꺼버려
  # SOS·화재 알림까지 함께 죽는다 — 절제가 기능의 일부다. 채널은 FCM뿐.
  review-reminder:
    enabled: ${ANOMALY_REVIEW_REMINDER_ENABLED:true}      # 킬 스위치. false면 재촉만 멈추고 이력 조회·오탐 응답은 그대로
    delay-minutes: ${ANOMALY_REVIEW_REMINDER_DELAY_MINUTES:60}   # 상황이 닫힌 뒤 건별 재촉까지 대기(대응 중엔 묻지 않는다)
    deadline-days: ${ANOMALY_REVIEW_REMINDER_DEADLINE_DAYS:3}    # 상황 시작 기준. 지나면 재촉 중단, PENDING 확정
    summary-time: ${ANOMALY_REVIEW_SUMMARY_TIME:20:00}           # 하루 1회 요약(KST). 미복용 요약 21:00과 겹치지 않게
    quiet-start: ${ANOMALY_REVIEW_QUIET_START:22:00}             # 야간 억제 시작(재촉만. 화재 알림 본체는 밤에도 나간다)
    quiet-end: ${ANOMALY_REVIEW_QUIET_END:08:00}                 # 야간 억제 종료. 걸린 건은 버리지 않고 아침으로 미룬다

notification:
  alimtalk:
    # 카카오 알림톡(Solapi 경유) — 카카오톡 채팅으로 도착하는 유일한 현실적 경로(전화번호 기반, 친구추가 불필요).
    # ⚠️ 승인된 템플릿 문구만 발송 가능(변수만 치환). 종류별 템플릿이 없으면 채널이 조용히 스킵된다.
    # ⚠️ Solapi 콘솔의 "알림톡 실패 시 SMS 대체발송"은 OFF로 유지할 것 — 코드에서도 disableSms=true.
    enabled: ${ALIMTALK_ENABLED:false}
    pf-id: ${ALIMTALK_PF_ID:}                  # 발신 프로필(KA01PF…) — .env.dev 주입
    templates:
      # 이상감지 보호자용 템플릿 — 2026-07-27 승인(KA01TP26071501…). templateId는 .env.dev 주입.
      # ⚠️ ANOMALY_DETECTED_SELF(피보호자 본인 수신분)는 여기에 매핑을 두지 않는다 — 승인 문구가
      #    보호자용("회원님께서 보호자로 등록하시고…")이라 본인에게 보내면 문구가 어긋나 채널 제재 대상이다.
      #    매핑이 없으므로 본인 알림톡은 스킵되고 FCM·WS·SMS만 나간다. (본인용 템플릿은 등록하지 않기로 결정)
      ANOMALY_DETECTED:
        template-id: ${ALIMTALK_TEMPLATE_ANOMALY:}
        # 값은 알림 data의 동명 키에서 바인딩 — 승인 템플릿 본문의 #{변수}와 이름·개수가 일치해야 한다.
        variables: [wardName, location, detectedTypeLabel, detectedAt]

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

# Actuator — 외부 노출은 health/info만 (민감 정보 유출 방지)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 외부에 DB/Redis 세부 상태 노출 방지
      show-details: never
      probes:
        enabled: true

firebase:
  # 서비스 계정 JSON을 base64로 인코딩해 환경변수에 보관.
  # 원본 JSON을 그대로 .env에 넣으면 docker compose env_file 파서가 \n을 실제 newline으로
  # 변환해 깨지는 문제가 있어 base64로 우회한다.
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

# ─── 로깅 ─────────────────────────────────────────────────────────────────
# 평문 패턴에 MDC userId 포함 (ApiLoggingAspect 가 주입). 미인증 요청에는 'anonymous' 표시.
# 구조적 JSON 로깅은 LOGGING_STRUCTURED_FORMAT 환경변수로 토글 (ecs / gelf / logstash 중 하나).
#   - 빈 값(기본): 평문 콘솔 로그
#   - 값 설정    : 해당 포맷의 JSON 로그 (MDC 자동 포함)
# 운영 적용 전에 로그 수집기/파서 호환성 확인 필요.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [trace=%X{traceId:-}] [user=%X{userId:-anonymous}] %logger{36} - %msg%n"
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT:}

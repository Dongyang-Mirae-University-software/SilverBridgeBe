# Gradle 빌드 성능 설정.
#
# 배경: CD 대상(vkcs-linux)은 구형 Xeon + HDD라 `gradle bootJar` 한 스텝이 ~8분 걸린다(측정값 495.8s).
# 매 배포가 항상 풀 컴파일이던 것을 캐시로 줄인다. Dockerfile의 BuildKit 캐시 마운트가
# GRADLE_USER_HOME 을 빌드 간 유지하므로, 아래 빌드 캐시가 실제로 재사용된다.

# 태스크 산출물 재사용(build-cache). 소스 일부만 바뀐 배포에서 전체 재컴파일을 피한다.
org.gradle.caching=true

# 독립 태스크 병렬 실행.
org.gradle.parallel=true

# 변경된 프로젝트만 재구성.
org.gradle.configureondemand=true

# 빌드 JVM 힙 — 기본(512m)은 컴파일 중 GC 압박이 커 느려진다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# ※ configuration-cache 는 켜지 않는다 — OWASP dependency-check 플러그인(10.0.4)이 미지원이라
#   `dependencyCheckAnalyze` 실행 시 빌드가 깨진다. 절감폭(수 초)도 작아 실익이 없다.

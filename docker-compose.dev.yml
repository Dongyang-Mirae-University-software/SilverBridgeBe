services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmu-dev-api
    image: dmu-api:dev
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "6511:6511"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:17
    container_name: dmu-dev-db
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "6513:5432"
    # Docker 루트가 NTFS/FUSE 등인 경우 named volume에서 initdb chmod 실패함.
    # 프로젝트 경로(ext4)에 바인드 마운트하여 PostgreSQL 데이터 디렉터리 권한 문제 회피.
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: dmu-dev-redis
    restart: unless-stopped
    ports:
      - "6514:6379"
    volumes:
      - dmu-dev-redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-net:
    name: dmu-dev-net
    # AI 서버 등 외부 서비스 연동 시 해당 컨테이너를 app-net에 추가하거나
    # 이 네트워크를 external: true로 선언하여 공유 가능

volumes:
  dmu-dev-redis-data:
    name: dmu-dev-redis-data

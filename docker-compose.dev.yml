services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmusso-dev-api
    image: dmusso-api:dev
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "6511:6511"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:16
    container_name: dmusso-dev-db
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "6513:5432"
    volumes:
      - dmusso-dev-db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: dmusso-dev-redis
    restart: unless-stopped
    ports:
      - "6514:6379"
    volumes:
      - dmusso-dev-redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-net:
    name: dmusso-dev-net

volumes:
  dmusso-dev-db-data:
    name: dmusso-dev-db-data
  dmusso-dev-redis-data:
    name: dmusso-dev-redis-data
